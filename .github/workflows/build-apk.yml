name: Build Noor Al-Quran APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Package unsigned APK and signing tool
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk Noor-Al-Quran-v1.3.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - name: Sign production APK when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          java -jar apksigner.jar sign \
            --ks release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out Noor-Al-Quran-v1.3.0.apk \
            Noor-Al-Quran-v1.3.0-unsigned.apk
          java -jar apksigner.jar verify --verbose --print-certs Noor-Al-Quran-v1.3.0.apk
          rm release.keystore
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Quran-Release-Package
          path: |
            Noor-Al-Quran-v1.3.0-unsigned.apk
            Noor-Al-Quran-v1.3.0.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30
